name: Windows Validation

on:
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    runs-on: windows-2022
    env:
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0 # full history so the libultraship submodule gitlink resolves
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: pip install -r libultraship/requirements.txt
      - name: Cache Vulkan SDK
        uses: actions/cache@v6
        with:
          key: windows-vulkan-sdk-v1
          path: C:\VulkanSDK
      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          # Skip the (large) download+install when the cache already restored the SDK.
          if (-not (Test-Path "C:\VulkanSDK\Lib")) {
            $url = "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe"
            Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\vulkan_sdk.exe"
            $p = Start-Process -FilePath "$env:RUNNER_TEMP\vulkan_sdk.exe" -ArgumentList "--root","C:\VulkanSDK","--accept-licenses","--default-answer","--confirm-command","install" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Vulkan SDK install failed with exit code $($p.ExitCode)" }
          }
          "VULKAN_SDK=C:\VulkanSDK" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          key: windows-validation-vcpkg-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            windows-validation-vcpkg-${{ github.ref }}
            windows-validation-vcpkg-
          path: |
            ~\AppData\Local\vcpkg\archives
      - name: sccache
        uses: hendrikmuhs/ccache-action@v1.2.14
        with:
          variant: sccache
          key: windows-validation-sccache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            windows-validation-sccache-${{ github.ref }}
            windows-validation-sccache-
      - name: Build
        run: |
          # Use the runner's preinstalled vcpkg (blanking VCPKG_ROOT made automate-vcpkg
          # try to clone into an empty path and fail).
          $env:VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT
          # Ninja (single-config) so the compiler launcher works; sccache caches MSVC objects.
          cmake -S . -B "build/x64" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DPython3_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"
          cmake --build ./build/x64 --parallel 10
      - name: Stage runtime deps
        shell: pwsh
        run: |
          Write-Host "=== build/x64 contents (top level) ==="
          Get-ChildItem build/x64 -Force | Format-Table Name, Length, Mode
          # Ensure shaderc ships even if the CMake POST_BUILD didn't stage it.
          if ((Test-Path "$env:VULKAN_SDK/Bin/shaderc_shared.dll") -and -not (Test-Path "build/x64/shaderc_shared.dll")) {
            Copy-Item "$env:VULKAN_SDK/Bin/shaderc_shared.dll" build/x64/ -Force
            Write-Host "Copied shaderc_shared.dll from the Vulkan SDK."
          }
          if (-not (Test-Path build/x64/.tcc)) { Write-Warning ".tcc was not produced in build/x64!" }
      - name: Sign binaries
        if: ${{ env.WINDOWS_CERT_PFX_BASE64 != '' }}
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = "$env:RUNNER_TEMP\codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          # Sign the exe and the bundled DLLs we ship (tcc.dll is the usual AV trigger).
          Get-ChildItem "build/x64" -Include Ghostship.exe,tcc.dll,shaderc_shared.dll -Recurse | ForEach-Object {
            & $signtool sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($_.FullName)" }
          }
          Remove-Item $pfx -Force
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ghostship-windows
          path: ./build/x64
          include-hidden-files: true
          retention-days: 1

  build-xbox:
    name: Xbox (Dev Mode)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: pip install -r libultraship/requirements.txt
      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          key: xbox-vcpkg-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            xbox-vcpkg-
          path: |
            ~\AppData\Local\vcpkg\archives
      - name: Set up the Universal Windows Platform workload
        shell: pwsh
        run: |
          $root = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $vs = & "$root\vswhere.exe" -latest -products * -property installationPath
          if (-not $vs) { throw "No Visual Studio installation found on the runner" }

          if (-not (Get-ChildItem "$vs\VC\Tools\MSVC\*\lib\x64\store" -ErrorAction SilentlyContinue)) {
            Write-Host "Installing the UWP workload into $vs"
            $p = Start-Process -FilePath "$root\vs_installer.exe" -Wait -PassThru -ArgumentList @(
              'modify', '--installPath', "`"$vs`"",
              '--add', 'Microsoft.VisualStudio.Workload.Universal',
              '--add', 'Microsoft.VisualStudio.ComponentGroup.UWP.VC',
              '--quiet', '--norestart', '--nocache')
            if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
              throw "UWP workload install failed with exit code $($p.ExitCode)"
            }
          }

          if (-not (Get-ChildItem "$vs\VC\Tools\MSVC\*\lib\x64\store" -ErrorAction SilentlyContinue)) {
            throw "App container CRT (lib/x64/store) still missing after installing the UWP workload"
          }

          $vcvars = "$vs\VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found at $vcvars" }
          "VCVARS=$vcvars" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VSPATH=$vs" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install Ninja
        shell: pwsh
        run: |
          $ninja = (Get-Command ninja -ErrorAction SilentlyContinue).Source
          if (-not $ninja) {
            $bundled = "$env:VSPATH\Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja\ninja.exe"
            if (Test-Path $bundled) {
              $ninja = $bundled
            } else {
              choco install ninja -y --no-progress
              $ninja = "C:\ProgramData\chocolatey\bin\ninja.exe"
            }
            if (-not (Test-Path $ninja)) { throw "ninja not found after install" }
            Split-Path $ninja | Out-File -FilePath $env:GITHUB_PATH -Append
          }
          Write-Host "ninja: $ninja"
      - name: Create a sideloading certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=Ghostship CI" `
            -KeyUsage DigitalSignature -FriendlyName "Ghostship CI" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}") `
            -NotAfter (Get-Date).AddYears(3)
          Export-Certificate -Cert $cert -FilePath ghostship-ci.cer | Out-Null
          "UWP_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build
        shell: cmd
        run: |
          call "%VCVARS%" || exit /b 1
          set "VCPKG_ROOT=%VCPKG_INSTALLATION_ROOT%"
          cmake -S . -B build-uwp -G Ninja -DCMAKE_BUILD_TYPE=Release -DXBOX_UWP=ON ^
            -DUWP_PACKAGE_PUBLISHER="CN=Ghostship CI" ^
            -DUWP_PACKAGE_CERT_THUMBPRINT=%UWP_CERT_THUMBPRINT% || exit /b 1
          cmake --build build-uwp --target ghostship_uwp_package || exit /b 1
      - name: Create package
        shell: pwsh
        run: |
          mkdir Ghostship-xbox
          Move-Item build-uwp/Ghostship.msix Ghostship-xbox/
          Copy-Item ghostship-ci.cer Ghostship-xbox/
          Copy-Item tools/deploy-xbox.ps1 Ghostship-xbox/
          $vclibs = Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft SDKs\Windows Kits\10\ExtensionSDKs\Microsoft.VCLibs\14.0\Appx\Retail\x64\Microsoft.VCLibs.x64.14.00.appx" -ErrorAction SilentlyContinue
          if (-not $vclibs) { throw "VCLibs framework package not found; the app would not activate on the console" }
          Copy-Item $vclibs.FullName Ghostship-xbox/
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ghostship-xbox
          path: Ghostship-xbox
          retention-days: 1