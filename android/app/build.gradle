import java.security.MessageDigest

plugins {
    id 'com.android.application'
}

def repoRoot = rootProject.projectDir.parentFile

def cmakeVersionMatcher = new File(repoRoot, 'CMakeLists.txt').text =~ /project\s*\([^)]*VERSION\s+([0-9.]+)/
def projectVersion = cmakeVersionMatcher ? cmakeVersionMatcher[0][1] : '0.0.0'

def gamedataDir = layout.buildDirectory.dir('generated/gamedata')

android {
    namespace 'dev.net64.ghostship'
    compileSdk 34
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'dev.net64.ghostship'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName projectVersion

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared',
                          '-DCMAKE_BUILD_TYPE=Release'
                targets 'Ghostship'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("${repoRoot}/CMakeLists.txt")
            // LUS requires CMake >= 3.24; the NDK-bundled 3.22.1 is too old.
            version '3.30.3+'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // debug-signed so release builds install without signing secrets
            signingConfig signingConfigs.debug
        }
    }

    sourceSets {
        main {
            assets.srcDirs += gamedataDir.get().asFile
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Bundled into APK assets and unpacked to app storage at runtime by AndroidUtils.cpp
tasks.register('packGameData', Zip) {
    def o2r = new File(repoRoot, 'ghostship.o2r')
    doFirst {
        if (!o2r.exists()) {
            throw new GradleException(
                "ghostship.o2r not found at ${o2r} — build the GeneratePortO2R target " +
                "on a desktop platform (or download the CI artifact) before building the APK.")
        }
    }
    from(new File(repoRoot, 'assets')) { into 'assets' }
    from(new File(repoRoot, 'config.yml'))
    from(o2r)
    archiveFileName = 'gamedata.zip'
    destinationDirectory = gamedataDir
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('stampGameData') {
    dependsOn packGameData
    def stampFile = gamedataDir.get().file('gamedata.version').asFile
    outputs.file(stampFile)
    doLast {
        def zipFile = gamedataDir.get().file('gamedata.zip').asFile
        def md5 = MessageDigest.getInstance('MD5').digest(zipFile.bytes).encodeHex().toString()
        stampFile.text = md5
    }
}

preBuild.dependsOn stampGameData
